<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-label="The causal opfibration: cocartesian lifts exist, cartesian lifts are absent">
  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#1b3a5c"/>
    </marker>
    <marker id="headRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#a4161a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="420" fill="#ffffff"/>

  <text x="390" y="32" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="bold"
        text-anchor="middle" fill="#12253a">The causal opfibration, constructed (Def. 4.14, Thm 4.15)</text>
  <text x="390" y="54" font-family="Helvetica,Arial,sans-serif" font-size="13.5"
        text-anchor="middle" fill="#44556b">replaces the original Figure 1 and the original Cor. 4.3</text>

  <!-- fibres -->
  <rect x="60" y="80" width="240" height="86" rx="10" fill="#eef4fb" stroke="#1b3a5c" stroke-width="1.6"/>
  <text x="180" y="108" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#12253a">fibre over X</text>
  <text x="180" y="132" font-family="Helvetica,Arial,sans-serif" font-size="14"
        text-anchor="middle" fill="#12253a">p⁻¹(X) = Instr</text>
  <text x="180" y="152" font-family="Helvetica,Arial,sans-serif" font-size="12.5"
        text-anchor="middle" fill="#44556b">(all objects, all instruments)</text>

  <rect x="480" y="80" width="240" height="86" rx="10" fill="#eef4fb" stroke="#1b3a5c" stroke-width="1.6"/>
  <text x="600" y="108" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="#12253a">fibre over Y</text>
  <text x="600" y="132" font-family="Helvetica,Arial,sans-serif" font-size="14"
        text-anchor="middle" fill="#12253a">p⁻¹(Y) = Instr</text>
  <text x="600" y="152" font-family="Helvetica,Arial,sans-serif" font-size="12.5"
        text-anchor="middle" fill="#44556b">the same category, not Instr(A⊗E)</text>

  <!-- cocartesian lift (forward) -->
  <line x1="300" y1="104" x2="478" y2="104" stroke="#1b3a5c" stroke-width="2" marker-end="url(#head)"/>
  <text x="389" y="96" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold"
        text-anchor="middle" fill="#1b3a5c">u! = (− ⊗ E_u) — cocartesian lift: exists</text>
  <text x="389" y="122" font-family="Helvetica,Arial,sans-serif" font-size="12.5"
        text-anchor="middle" fill="#44556b">(Y, H ⊗ E_u), tautological instrument</text>

  <!-- cartesian lift (backward, absent) -->
  <line x1="478" y1="150" x2="302" y2="150" stroke="#a4161a" stroke-width="2" stroke-dasharray="7 5"
        marker-end="url(#headRed)"/>
  <text x="389" y="170" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold"
        text-anchor="middle" fill="#a4161a">u* — cartesian lift: ABSENT whenever dim E_u ≥ 2</text>
  <text x="389" y="188" font-family="Helvetica,Arial,sans-serif" font-size="12.5"
        text-anchor="middle" fill="#7a1d20">(would need the internal hom [E_u, −]: Thms 4.3, 4.8)</text>

  <!-- projection arrows -->
  <line x1="180" y1="166" x2="180" y2="300" stroke="#8a99ab" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="600" y1="166" x2="600" y2="300" stroke="#8a99ab" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="196" y="240" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6b7d">p</text>
  <text x="616" y="240" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6b7d">p</text>

  <!-- base poset -->
  <line x1="90" y1="300" x2="690" y2="300" stroke="#5b6b7d" stroke-width="1.4"/>
  <circle cx="180" cy="300" r="4.5" fill="#1b3a5c"/>
  <circle cx="600" cy="300" r="4.5" fill="#1b3a5c"/>
  <text x="180" y="324" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle"
        fill="#12253a">X</text>
  <text x="600" y="324" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle"
        fill="#12253a">Y</text>
  <line x1="196" y1="283" x2="584" y2="283" stroke="#1b3a5c" stroke-width="1.8" marker-end="url(#head)"/>
  <text x="390" y="276" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="middle"
        fill="#1b3a5c">u : X → Y in the base poset P (a stage extension with environment E_u; E_⊥ = ℂ,
        E_(v∘u) ≅ E_u ⊗ E_v)</text>

  <!-- caption -->
  <text x="390" y="366" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="middle"
        fill="#12253a">Bifibration ⟺ every u! = (−⊗E_u) has a right adjoint ⟺ every E_u ≅ ℂ.</text>
  <text x="390" y="388" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle"
        fill="#44556b">The base is the extension relation, not time; all fibres coincide, so the
        bifibration property is a property of the
  </text>
  <text x="390" y="405" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle"
        fill="#44556b">environment assignment, not of the dynamics (Remark 4.16).</text>
</svg>
