<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" role="img" aria-label="The causal opfibration: cocartesian lifts exist, cartesian lifts are absent">
  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#1b3a5c"/>
    </marker>
    <marker id="headRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#a4161a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>

  <text x="390" y="34" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="bold"
        text-anchor="middle" fill="#12253a">The causal opfibration, constructed (Def. 4.14, Thm 4.15)</text>
  <text x="390" y="56" font-family="Helvetica,Arial,sans-serif" font-size="13"
        text-anchor="middle" fill="#44556b">replaces the original Figure 1 and the original Cor. 4.3</text>

  <!-- fibres -->
  <rect x="15" y="90" width="205" height="84" rx="10" fill="#eef4fb" stroke="#1b3a5c" stroke-width="1.6"/>
  <text x="117" y="118" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="bold"
        text-anchor="middle" fill="#12253a">fibre over X</text>
  <text x="117" y="140" font-family="Helvetica,Arial,sans-serif" font-size="13.5"
        text-anchor="middle" fill="#12253a">p⁻¹(X) = Instr</text>
  <text x="117" y="158" font-family="Helvetica,Arial,sans-serif" font-size="11"
        text-anchor="middle" fill="#44556b">all objects, all instruments</text>

  <rect x="560" y="90" width="205" height="84" rx="10" fill="#eef4fb" stroke="#1b3a5c" stroke-width="1.6"/>
  <text x="662" y="118" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="bold"
        text-anchor="middle" fill="#12253a">fibre over Y</text>
  <text x="662" y="140" font-family="Helvetica,Arial,sans-serif" font-size="13.5"
        text-anchor="middle" fill="#12253a">p⁻¹(Y) = Instr</text>
  <text x="662" y="150" font-family="Helvetica,Arial,sans-serif" font-size="10.5"
        text-anchor="middle" fill="#44556b">the same category —</text>
  <text x="662" y="166" font-family="Helvetica,Arial,sans-serif" font-size="10.5"
        text-anchor="middle" fill="#44556b">not Instr(A⊗E)</text>

  <!-- corridor: cocartesian lift -->
  <text x="390" y="110" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#1b3a5c">u! = (−⊗E_u) — cocartesian lift: exists</text>
  <line x1="222" y1="124" x2="558" y2="124" stroke="#1b3a5c" stroke-width="2" marker-end="url(#head)"/>
  <text x="390" y="141" font-family="Helvetica,Arial,sans-serif" font-size="11.5"
        text-anchor="middle" fill="#44556b">lift (Y, H⊗E_u) with the identity instrument</text>

  <!-- corridor: cartesian lift (absent) -->
  <line x1="558" y1="160" x2="222" y2="160" stroke="#a4161a" stroke-width="2" stroke-dasharray="7 5"
        marker-end="url(#headRed)"/>
  <text x="390" y="186" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#a4161a">u* — cartesian lift: absent if dim E_u ≥ 2</text>
  <text x="390" y="202" font-family="Helvetica,Arial,sans-serif" font-size="11.5"
        text-anchor="middle" fill="#7a1d20">it would need the internal hom [E_u, −] (Thms 4.3, 4.8)</text>

  <!-- projection arrows -->
  <line x1="117" y1="174" x2="117" y2="330" stroke="#8a99ab" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="662" y1="174" x2="662" y2="330" stroke="#8a99ab" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="125" y="262" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6b7d">p</text>
  <text x="670" y="262" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6b7d">p</text>

  <!-- base poset -->
  <text x="390" y="286" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle"
        fill="#1b3a5c">u : X → Y in the base poset P — a stage extension with environment E_u</text>
  <text x="390" y="304" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle"
        fill="#5b6b7d">coherence: E_⊥ = ℂ and E_(v∘u) ≅ E_u ⊗ E_v</text>
  <line x1="222" y1="322" x2="558" y2="322" stroke="#1b3a5c" stroke-width="1.8" marker-end="url(#head)"/>
  <line x1="60" y1="322" x2="720" y2="322" stroke="#5b6b7d" stroke-width="1.4"/>
  <circle cx="117" cy="322" r="4.5" fill="#1b3a5c"/>
  <circle cx="662" cy="322" r="4.5" fill="#1b3a5c"/>
  <text x="117" y="346" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle"
        fill="#12253a">X</text>
  <text x="662" y="346" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle"
        fill="#12253a">Y</text>

  <!-- caption -->
  <text x="390" y="390" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="middle"
        fill="#12253a">Bifibration ⟺ every u! = (−⊗E_u) has a right adjoint ⟺ every E_u ≅ ℂ.</text>
  <text x="390" y="414" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle"
        fill="#44556b">The base is the extension relation, not time, and all fibres coincide: the bifibration property is a</text>
  <text x="390" y="432" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle"
        fill="#44556b">property of the environment assignment, not of the dynamics (Remark 4.16).</text>
</svg>
